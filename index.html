<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO COMMAND CENTER</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.95);
            --border-color: #30363d;
            --cyan-accent: #58a6ff;
            --green-accent: #3fb950;
            --orange-accent: #d29922;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .terminal-container {
            width: 100%;
            max-width: 820px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }

        .terminal-header {
            padding: 12px 16px;
            background: #161b22;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            color: var(--cyan-accent);
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            color: var(--green-accent);
            border: 1px solid var(--green-accent);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .config-bar {
            padding: 8px 16px;
            background: #0d1117;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .config-bar input {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        .config-bar button {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--cyan-accent);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
        }

        .config-bar button:hover {
            background: #30363d;
        }

        .terminal-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .msg-system {
            color: var(--text-dim);
            border-left: 2px solid var(--cyan-accent);
            padding-left: 10px;
        }

        .msg-user {
            color: #f0883e;
            border-left: 2px solid #f0883e;
            padding-left: 10px;
        }

        .msg-agent {
            border-left: 2px solid var(--green-accent);
            padding-left: 10px;
            white-space: pre-wrap;
        }

        .agent-tag {
            font-weight: bold;
            color: var(--green-accent);
            margin-bottom: 4px;
        }

        .input-bar {
            padding: 12px 16px;
            background: #161b22;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .input-bar input {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 0.9rem;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        .input-bar input:focus {
            outline: 1px solid var(--cyan-accent);
        }

        .input-bar button {
            background: #238636;
            border: 1px solid rgba(240, 246, 252, 0.1);
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
        }

        .input-bar button:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">
        <div class="title">⚡ MO_COMMAND_CENTER</div>
        <div class="status-badge" id="netStatus">DIRECT ROUTE // OPENROUTER</div>
    </div>

    <div class="config-bar">
        <input type="password" id="apiKeyInput" placeholder="輸入 OpenRouter API Key (sk-or-v1-...)">
        <button onclick="saveApiKey()">儲存 KEY</button>
    </div>

    <div class="terminal-body" id="chatArea">
        <div class="msg-block msg-system">
            <div>[MO_CORE // DISPATCH ENGINE ONLINE]</div>
            <div>浩賢你好！中控直連引擎已就緒。原生支援香港寬頻直出，毋須掛載 VPN 或反向代理。</div>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="發放任何指令、勤務筆記或問題..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()">EXEC</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "mo_core_openrouter_key";
    const MODEL_NAME = "openai/gpt-4o-mini";
    const DISPATCHER_PROMPT = `
你係 MO 核心系統嘅「總指揮大腦（MO_CORE / CEO）」，專門為巫浩賢統籌全局。
你手下管理住 4 個專屬部門（Agent）：
1. [LKFSTN] 局內勤務、車輛裝備檢查、操練、事故出更日誌與輪更待辦。當使用者提到返工、更表、消防車輛或操練，必須整理成極標準的勤務日誌格式（日期時間、車次項目、執勤內容、跟進事項）。
2. [DEV] NAS 部署、Docker、Linux 指令、代碼與架構排除。
3. [LIFE] 個人生活資料庫、長期存檔（例如寵物健康與用藥、水草魚缸水質參數、車輛維護週期、私人資料歸檔）。
4. [BUDDY] 日常生活特助、行程規劃、閒聊、隨身軍師。

【輸出規則】
回覆的第一行，必須嚴格按照格式標註調用的 Agent 代號，例如：
<<<LKFSTN>>>
或
<<<DEV>>>
或
<<<LIFE>>>
或
<<<BUDDY>>>

由第二行開始輸出正文內容：
- 一律使用道地香港人口吻（廣東話口語）回答，直接給出重點，俐落乾脆，不講廢話。
- 如果是複雜問題，先回答結論，再以點列方式給出具體建議。
`;

    // 載入預設或儲存的 API Key
    window.onload = function() {
        const savedKey = localStorage.getItem(STORAGE_KEY) || "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";
        document.getElementById('apiKeyInput').value = savedKey;
        localStorage.setItem(STORAGE_KEY, savedKey);
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key) {
            localStorage.setItem(STORAGE_KEY, key);
            appendSystemMsg("API Key 已成功儲存於本地瀏覽器！");
        }
    }

    function appendSystemMsg(text) {
        const chatArea = document.getElementById('chatArea');
        const block = document.createElement('div');
        block.className = 'msg-block msg-system';
        block.innerText = text;
        chatArea.appendChild(block);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function handleKey(e) {
        if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const apiKey = localStorage.getItem(STORAGE_KEY) || document.getElementById('apiKeyInput').value.trim();

        if (!text) return;
        if (!apiKey) {
            appendSystemMsg("[ERR] 請先於頂部輸入並儲存 OpenRouter API Key！");
            return;
        }

        const chatArea = document.getElementById('chatArea');

        // 使用者訊息
        const userBlock = document.createElement('div');
        userBlock.className = 'msg-block msg-user';
        userBlock.innerHTML = `<div>&gt; ${text}</div>`;
        chatArea.appendChild(userBlock);

        input.value = "";
        chatArea.scrollTop = chatArea.scrollHeight;

        // 載入中狀態
        const loadingBlock = document.createElement('div');
        loadingBlock.className = 'msg-block msg-system';
        loadingBlock.innerText = ">>> ROUTING VIA MO_CORE (OpenRouter)...";
        chatArea.appendChild(loadingBlock);
        chatArea.scrollTop = chatArea.scrollHeight;

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.href,
                    "X-Title": "MO_COMMAND_CENTER"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        { role: "system", content: DISPATCHER_PROMPT },
                        { role: "user", content: text }
                    ],
                    temperature: 0.5
                })
            });

            const data = await res.json();
            chatArea.removeChild(loadingBlock);

            if (data.choices && data.choices[0]) {
                const rawReply = data.choices[0].message.content;
                let agent = "BUDDY";
                let cleanReply = rawReply;

                const match = rawReply.match(/^<<<([A-Z]+)>>>\s*/);
                if (match) {
                    agent = match[1];
                    cleanReply = rawReply.substring(match[0].length).trim();
                }

                const badgeMap = {
                    "LKFSTN": "🚒 [LKFSTN.EXE // 勤務日誌]",
                    "LIFE": "🌱 [LIFE.EXE // 私人檔案]",
                    "DEV": "💻 [DEV.EXE // 系統技術架構]",
                    "BUDDY": "⚡ [BUDDY.EXE // 隨身特助]"
                };

                const header = badgeMap[agent] || `🤖 [${agent}.EXE]`;

                const replyBlock = document.createElement('div');
                replyBlock.className = 'msg-block msg-agent';
                replyBlock.innerHTML = `<div class="agent-tag">${header}</div><div>${cleanReply}</div>`;
                chatArea.appendChild(replyBlock);
            } else {
                appendSystemMsg(`[MO_CORE ERR] 接口異常：${JSON.stringify(data)}`);
            }
        } catch (err) {
            if (loadingBlock.parentNode) chatArea.removeChild(loadingBlock);
            appendSystemMsg(`[MO_CORE ERR] 連線例外：${err.message}`);
        }

        chatArea.scrollTop = chatArea.scrollHeight;
    }
</script>

</body>
</html>
